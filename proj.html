
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA Dashboard</title>
    <link rel="stylesheet" href="proj.css">
</head>
<body>

<div class="browser">

    <div class="browser-top">
        <div class="dots">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
        </div>

        <div class="address">127.0.0.1:5500/index.html</div>
    </div>

    <header>NETRA</header>

    <main>
        <div class="cards">

            <div class="card">
                <h4>ROVERS ONLINE</h4>
                <h2>6 / 6</h2>
                <p>Active rover units</p>
            </div>

            <div class="card">
                <h4>AVERAGE BATTERY</h4>
                <h2>76%</h2>
                <p>Fleet battery level</p>
            </div>

            <div class="card">
                <h4>OPEN ALERTS</h4>
                <h2>0</h2>
                <p>Requires attention</p>
            </div>

            <div class="card">
                <h4>DISTANCE TODAY</h4>
                <h2>13.6 km</h2>
                <p>Total simulated<br>distance</p>
            </div>

        </div>

        <div class="checkpoint">
            Checkpoint: expected result
        </div>
    </main>

</div>

</body>
</html>
