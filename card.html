
<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 300px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .image-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        /* Image hover effect */
        .image-container:hover img {
            transform: scale(1.12);
        }

        .card-content {
            padding: 20px;
            text-align: center;
        }

        .card-content h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Nature">
        </div>

        <div class="card-content">
            <h2>Beautiful Nature</h2>

            <p>
                Explore the beauty of nature and enjoy
                the peaceful scenery.
            </p>

            <button>Explore More</button>
        </div>

    </div>

</body>
</html>
