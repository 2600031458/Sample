<html>
    <body>
<h2>addition of two numbers</h2>
<input type="number" id="num1" placeholder="Enter first number" /><br/><br/>
<input type="number" id="num2" placeholder="Enter second number"/><br/><br/>
<button onclick="addnumber()">Add</button>
<h3 id="result"></h3>

<button onclick=" subnumber()">sub</button>
<h3 id="result"></h3>

<button onclick="mulnumber()">mul</button>
<h3 id="result"></h3>
<script>
    function addnumber(){
        let a= Number(document.getElementById("num1").value);
        let b= Number(document.getElementById("num2").value);
        let sum=a+b;
        document.getElementById("result").innerHTML="Addition = "+sum;
    }
     function subnumber(){
        let a= Number(document.getElementById("num1").value);
        let b= Number(document.getElementById("num2").value);
        let sub=a-b;
         document.getElementById("result").innerHTML="Subtraction = "+sub;
     }
     function mulnumber(){
        let a= Number(document.getElementById("num1").value);
        let b= Number(document.getElementById("num2").value);
        let mul=a*b;
         document.getElementById("result").innerHTML="multiplication = "+mul;
     }

</script>

</body>
</html>
